<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#111;color:#ddd;font:13px system-ui,sans-serif;overflow:hidden}
#stage{position:absolute;inset:0 0 54px 0;display:flex;align-items:center;justify-content:center}
#stage canvas{max-width:100%;max-height:100%;display:block}
#bar{position:absolute;left:0;right:0;bottom:0;height:54px;padding:6px 10px;box-sizing:border-box;background:#1b1b1b}
#row{display:flex;gap:8px;align-items:center}
#play{width:34px;height:26px;border:0;border-radius:4px;background:#333;color:#fff;cursor:pointer}
#scrub{flex:1}
#marks{position:relative;height:6px;margin:2px 42px 0}
#marks span{position:absolute;top:0;width:2px;height:6px;background:#888}
#status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#aaa;font-size:12px;margin-top:2px}
</style></head><body>
<div id="stage"></div>
<div id="bar"><div id="row"><button id="play">▶</button><input id="scrub" type="range" min="0" value="0"></div><div id="marks"></div><div id="status">Loading…</div></div>
<script src="/runtime/preview.js"></script></body></html>
